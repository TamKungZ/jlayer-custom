name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. 1.2.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Resolve version
        id: version
        run: |
          if [[ ! "$TAG" =~ ^([0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?)$ ]]; then
            echo "::error::Tag '$TAG' is not a valid version tag"
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          pom_version="$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' pom.xml | head -n 1 | tr -d '\r')"
          if [ "$version" != "$pom_version" ]; then
            echo "::error::Tag version '$version' does not match pom.xml version '$pom_version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Extract release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/changelog-section.sh "$VERSION" > "$RUNNER_TEMP/release-notes.md"

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
          server-id: central
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.SIGN_GPG_PRIVATE }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE

      - name: Verify signing key
        run: |
          key="$(sed -n 's:.*<gpg.keyname>\(.*\)</gpg.keyname>.*:\1:p' pom.xml | head -n 1 | tr -d '\r')"
          gpg --list-secret-keys --keyid-format long
          if ! gpg --list-secret-keys "$key" > /dev/null 2>&1; then
            echo "::error::SIGN_GPG_PRIVATE has no secret key $key (gpg.keyname in pom.xml). Export it with: gpg --armor --export-secret-keys $key"
            exit 1
          fi

      - name: Build, test, sign and deploy to Maven Central
        env:
          MAVEN_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.SIGN_GPG_PASSPHRASE }}
        run: mvn -B -ntp clean deploy

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          files=(target/jlayer-custom-"$VERSION"*.jar)
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" \
              --verify-tag \
              --title "$TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              "${prerelease[@]}"
          fi
